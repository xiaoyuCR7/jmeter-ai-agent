name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements*.txt
      # Universal locks carry platform markers, so one file serves every OS in the
      # test matrix. Regenerate locally with exactly these two commands.
      - name: Rebuild lock files
        run: |
          python -m pip install uv==0.13.0
          uv pip compile --universal --python-version 3.11 --quiet requirements.in -o requirements.txt
          uv pip compile --universal --python-version 3.11 --quiet requirements-dev.in -o requirements-dev.txt
      - name: Require committed locks to be current
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  # Mistakes a test run does not always reach: undefined names, unused imports, lost exception causes.
  # The rules are in jmeter-agent-backend/ruff.toml; the ruff version comes from requirements-dev.txt.
  backend-lint:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app scripts tests

  backend-portable:
    needs: dependency-lock
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            # One entry measures coverage; the floor sits a little under what the suite reaches (84%),
            # so it fails when a change adds code without tests, not on a platform's rounding.
            coverage: '--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80'
          - os: ubuntu-latest
            python-version: '3.13'
            coverage: ''
          - os: windows-latest
            python-version: '3.13'
            coverage: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check supported-Python syntax
        run: python -m compileall -q app
      - name: Run portable backend suite
        run: python -m pytest tests -q ${{ matrix.coverage }}

  # The portable suite skips every check that needs JMeter itself: names JMeter cannot load,
  # settings it never reads, plans it refuses. This job installs JMeter and runs them.
  backend-jmeter:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JMETER_VERSION: '5.6.3'
      JMETER_SHA512: 5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - uses: actions/cache@v4
        id: jmeter-cache
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}.tgz
          key: jmeter-${{ env.JMETER_VERSION }}
      - name: Download JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o "apache-jmeter-$JMETER_VERSION.tgz" "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz"
      # The app expects bin/ and lib/ at the repository root, as in a local install.
      - name: Install JMeter
        run: |
          echo "$JMETER_SHA512  apache-jmeter-$JMETER_VERSION.tgz" | sha512sum -c -
          tar -xzf "apache-jmeter-$JMETER_VERSION.tgz"
          mv "apache-jmeter-$JMETER_VERSION/bin" "apache-jmeter-$JMETER_VERSION/lib" .
          bin/jmeter --version
      - name: Install exact dependencies
        working-directory: jmeter-agent-backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run the checks against real JMeter
        working-directory: jmeter-agent-backend
        env:
          RUN_JMETER_TESTS: '1'
        run: python -m pytest tests/test_editor_components.py tests/test_generated_plans_jmeter.py -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jmeter-agent-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jmeter-agent-frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      # Errors fail the job; each remaining `any` is listed as a warning (see eslint.config.js).
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test:run
      - name: Type-check and build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: jmeter-agent-frontend/test-results/
          retention-days: 7
