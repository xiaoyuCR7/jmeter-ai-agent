name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements*.txt
      # Universal locks carry platform markers, so one file serves every OS in the
      # test matrix. Regenerate locally with exactly these two commands.
      - name: Rebuild lock files
        run: |
          python -m pip install uv==0.13.0
          uv pip compile --universal --python-version 3.11 --quiet requirements.in -o requirements.txt
          uv pip compile --universal --python-version 3.11 --quiet requirements-dev.in -o requirements-dev.txt
      - name: Require committed locks to be current
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  backend-portable:
    needs: dependency-lock
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jmeter-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jmeter-agent-backend/requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check supported-Python syntax
        run: python -m compileall -q app
      - name: Run portable backend suite
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jmeter-agent-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jmeter-agent-frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run tests
        run: npm run test:run
      - name: Type-check and build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: jmeter-agent-frontend/test-results/
          retention-days: 7
